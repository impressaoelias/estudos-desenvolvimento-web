<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formularios-exercicíos-2</title>
</head>
<body>
    <h1>formularios-exercicíos-2</h1>

<form action="processa.html" target="_blank">
<fieldset>
    <legend>Dados pessoais</legend>
<label for="nome">Nome</label> <br>
<input type="text" name="nome" id="nome"> <br>

<label for="email">Email</label> <br>
<input type="text" name="email" id="email"> <br>
<input type="checkbox" name="receber" id="receber">
<label for="receber">Quero receber e-mail</label>
<br><br>
<label for="senha">Senha</label> <br>
<input name="senha" id="senha" type="password">
</fieldset>
<fieldset>
  <legend>Informações adicionais</legend>

  <input type="radio" name="tipo" value="Fisica" id="fisica">
<label for="fisica">Pessoa fisica</label>

<input type="radio" name="tipo" value="Juridica" id="juridica">
<label for="juridica">Pessoa juridica</label> 

</fieldset>
<input type="submit" name="Cadastrar" value="Cadastrar">
</form>










</body>
</html>
