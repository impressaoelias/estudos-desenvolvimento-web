<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>
    <h1><u>Tabelas</u></h1>
<!--
table -> tablela
tr -> Table row (linha de tabela)    
td -> Table data (dados da tabela) * table cell (celulas da tabela)
th -> Table header (cabeçalho da tabela)
Não ultilizar o border, apenas para fins de estudo mais a frente ultilizar css
colspan -> extenção de coluna
rowspan -> pan
-->
<table border="1">
    <tr>
            <th>Produto</th>
            <th>Quantidade</th>
            <th>Preço</th>
    </tr>
    <tr>
        <td>Notbook</td>
        <td>50</td>
        <td>R$ 5000</td>
    </tr>
     <tr>
        <td>Tablet</td>
        <td>70</td>
        <td>R$ 2000</td>
    </tr>
    <tr>
      <td rowspan="2">desconto</td>
        <td colspan="2">cupom 1 R$20</td>
    </tr>
    <tr>
        <td colspan="2">cupom 2 R$20</td>
    </tr>
</table>




</body>
</html>
