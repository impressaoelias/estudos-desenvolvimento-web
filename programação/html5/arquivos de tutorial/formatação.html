<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formatação</title>
</head>
<body>
    <u><h1>Formatação de texto</h1></u>
    <hr>
<!--
    <b>(bold - negrito) representa um texto diferente do normal
    <strong>(forte) representa um texto com importancia
    <em>(emphases - énfase) coloca alguma enfase no texto
    <mark>(marca) representa um texto marcado
    <u>(underline - sublinhado) texto com sublinhado
    <del>(deleted - apagado) texto com marca de apagado
    <sup>(superscript text - sobrescrita)
    <sub>(subscript text - subscrito)
-->

<b>Esse texto esta em negrito com bold</b> 
<br>
<strong>Esse texto esta em negrito com strong</strong>
<br>
<em>Esse texto esta em énfase usando em</em>
<br>
<mark>Esse texto esta marcado com mark</mark>
<br>
<u>Esse texto esta sublinhado com u</u>
<br>
<del>Esse texto esta apagado com del</del>
<br>
sobrescrito: 25<sup>4</sup>
<br>
subscrito: 90<sub>7</sub>


</body>
</html>
