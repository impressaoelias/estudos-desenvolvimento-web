<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mais tabelas</title>
</head>
<body>
    <h1>mais sobre tabelas</h1>
<!--
caption -> legenda / titulo da tabela    
theader -> table header (cabeçalho da tabela)
tbody -> table body (corpo da tabela)
tfoot -> table footer (rodapé da tabela)
-->
<table border="1">
<caption>Inventario de produtos</caption>
<thead>
    <tr>
        <th>Produto</th>
        <th>Quantidade</th>
        <th>Preço</th>
    </tr>
</thead>
<tbody>
<tr>
    <td>Notbook</td>
    <td>300</td>
    <td>R$ 6000</td>
</tr>
<tr>
    <td>Tablet</td>
    <td>600</td>
    <td>R$ 2000</td>
</tr>
</tbody>
<tfoot>
<tr>
    <td>Total</td>
    <td colspan="2'">R$ 8000</td>
</tr>

</tfoot>



</table>









</body>
</html>
